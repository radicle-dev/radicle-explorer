# Entry point for CI. garden-broker stores a bare `buildkite-agent pipeline
# upload` as the server-side configuration, so the agent looks for this file by
# its default name. The other files here are uploaded from below.
#
# The broker creates exactly one Buildkite pipeline per Radicle repo, so every
# suite lands in this single build. Keep cache volume names distinct across the
# uploaded files: volumes are scoped to the pipeline, and a step that commits a
# volume version discards what a concurrent step wrote to the same volume.
#
# Superseded builds are not cancelled. Buildkite has no YAML equivalent of the
# GitHub Actions cancel-in-progress.

steps:
  - label: ":pipeline: upload"
    commands:
      - buildkite-agent pipeline upload .buildkite/node-checks.yml
      - buildkite-agent pipeline upload .buildkite/e2e.yml
      - buildkite-agent pipeline upload .buildkite/visual.yml
      - buildkite-agent pipeline upload .buildkite/rust.yml
