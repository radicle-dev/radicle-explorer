# Mirrors .github/workflows/ as four checks that run side by side. Each
# check starts from the environment image's warm checkout (node_modules,
# target/ with clippy, test, doc builds, the Radicle binaries and
# Playwright's Chromium), so most of the time goes to the code the change
# touched.
#
# Not mirrored: check-visual.yml, whose baseline snapshots live only in a
# GitHub Actions cache.
setup:
  - run: npm install --prefer-offline
  - run: ./scripts/install-binaries
# tests/tmp/bin holds the binaries in one directory per pinned release, and
# install-binaries downloads any release it has no directory for.
keep: [node_modules, target, tests/tmp/bin]
checks:
  # check.yml, check-unit-test.yml, check-http-client-unit-test.yml
  - name: js
    run: |
      set -e
      npm run check
      npm run test:unit
      npm run test:http-client:unit
    timeout: 15m
    watch:
      - package.json
      - package-lock.json
      - tsconfig.json
      - eslint.config.js
      - vite.config.ts
      - svelte.config.js
      - scripts/check
      - tests/support/**
  # check-rust.yml: lint and docs. --no-deps documents only this
  # workspace: rustdoc caps lints in dependencies, so it gates the same
  # warnings in a fraction of the time.
  - name: rust-lint
    run: |
      set -e
      cargo fmt --all -- --check
      RUSTFLAGS="-D warnings" cargo clippy --workspace --all-features --tests --locked
      RUSTFLAGS="-D warnings" cargo clippy -p radicle-httpd --no-default-features --tests --locked
      RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
    timeout: 20m
    watch: [Cargo.toml, Cargo.lock, rust-toolchain]
  # check-rust.yml: build and test. The test builds run with
  # -D warnings in rust-lint's clippy.
  - name: rust-test
    run: |
      set -e
      cargo test --workspace --all-features --locked
      cargo test -p radicle-httpd --locked
    timeout: 20m
    watch: [Cargo.toml, Cargo.lock, rust-toolchain]
  # check-build.yml and check-e2e.yml. The smoke test needs a build with
  # the default config, so it runs before the e2e suite rebuilds with the
  # test config. Needs storage.googleapis.com on the egress allowlist
  # until the image holds Chromium.
  - name: e2e
    run: |
      set -e
      npx playwright install --only-shell chromium
      npm run build
      CI=true npm run test:e2e -- --project chromium --config playwright.buildSmoke.config.ts
      CI=true npm run test:e2e -- --project chromium
    timeout: 30m
    watch:
      - package.json
      - package-lock.json
      - playwright.config.ts
      - playwright.buildSmoke.config.ts
      - tests/support/**
